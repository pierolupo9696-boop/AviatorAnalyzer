name: Build Aviator Analyzer APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Estrai il progetto Android
        run: |
          mkdir -p android-project
          unzip -o AviatorAnalyzer_Android_Project.zip -d android-project

      - name: Compila APK
        run: |
          gradle -p android-project assembleDebug --stacktrace

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorAnalyzer-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
