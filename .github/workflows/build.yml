name: Build Aviator Analyzer APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Estrai il progetto Android
        run: |
          mkdir -p android-project
          unzip -o AviatorAnalyzer_Android_Project.zip -d android-project

      - name: Allinea Java a JVM 17
        run: |
          cat > /tmp/jvm17.init.gradle <<'EOF'
          gradle.projectsEvaluated {
            allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                sourceCompatibility = '17'
                targetCompatibility = '17'
                options.release = 17
              }
            }
          }
          EOF

      - name: Compila APK
        run: |
          gradle -I /tmp/jvm17.init.gradle -p android-project assembleDebug --stacktrace

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorAnalyzer-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
